<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rock Statue - Dynamic Lighting</title>
<style>
body { margin:0; overflow:hidden; font-family:'Arial',sans-serif; }
canvas { display:block; }
#loader{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:24px;color:#fff;}
#notice{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);color:#fff;display:flex;align-items:center;justify-content:center;font-size:2rem;}
#logo { position: fixed; top: 20px; right: 20px; max-width:150px; opacity:0.8; transition: opacity 0.5s ease; }
#logo:hover { opacity:1; }
</style>
</head>
<body>
<div id="loader">Loading...</div>
<div id="notice"><p>Click and drag to rotate the model!</p></div>
<img id="logo" src="logo.png" alt="Logo">

<script src="https://cdn.jsdelivr.net/npm/three@0.135.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.135.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.135.0/examples/js/loaders/GLTFLoader.js"></script>

<script>
// Scene, Camera, Renderer
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.001, 10);
camera.position.set(0, 0.03, 0.08);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

// Controls
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;

// Loader & Notice
const loaderElement = document.getElementById('loader');
const noticeElement = document.getElementById('notice');
noticeElement.addEventListener('click', ()=> noticeElement.style.display='none');

// Background
new THREE.TextureLoader().load("bg1.jpg", tex => scene.background = tex);

// --- Lighting for rock statue ---
const ambientLight = new THREE.AmbientLight(0xffffff, 0.1);
scene.add(ambientLight);

// Key directional light (upper-mid body)
const keyLight = new THREE.DirectionalLight(0xffffff, 0.6);
keyLight.position.set(0, 0.08, 0.05);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048,2048);
keyLight.shadow.radius = 2;
scene.add(keyLight);

// Top spotlight
const topLight = new THREE.DirectionalLight(0xffffff, 0.5);
topLight.position.set(0, 0.09, 0);
topLight.target.position.set(0, 0.05, 0);
topLight.castShadow = true;
topLight.shadow.mapSize.set(2048,2048);
scene.add(topLight); scene.add(topLight.target);

// Mid-body fill lights (dynamic warm/cool subtle)
const midLeft = new THREE.DirectionalLight(0xfff8f0, 0.25); // warm tint
midLeft.position.set(-0.05,0.045,0);
midLeft.target.position.set(0,0.03,0);
scene.add(midLeft); scene.add(midLeft.target);

const midRight = new THREE.DirectionalLight(0xf0f8ff,0.25); // cool tint
midRight.position.set(0.05,0.045,0);
midRight.target.position.set(0,0.03,0);
scene.add(midRight); scene.add(midRight.target);

// Rim/back light
const rimLight = new THREE.DirectionalLight(0xffffff, 0.15);
rimLight.position.set(0,0.06,-0.05);
rimLight.target.position.set(0,0.03,0);
scene.add(rimLight); scene.add(rimLight.target);

// Soft base fill (slightly lowered intensity)
const baseFill = new THREE.PointLight(0xffffff, 0.15, 0.2);
baseFill.position.set(0, 0.01, 0);
scene.add(baseFill);

// Ground
const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(0.5,0.5),
    new THREE.ShadowMaterial({opacity:0.2})
);
ground.rotation.x = -Math.PI/2;
ground.position.y = -0.025;
ground.receiveShadow = true;
scene.add(ground);

// Axes helper
scene.add(new THREE.AxesHelper(0.05));

// Load GLTF Model
const loader = new THREE.GLTFLoader();
let model;
loader.load('5.glb', gltf => {
    model = gltf.scene;
    model.scale.set(1,1,1);
    model.rotation.set(0, Math.PI/2, 0);
    model.position.set(0,0,0);

    model.traverse(c => {
        if(c.isMesh && c.material){
            c.castShadow = true;
            c.receiveShadow = true;
            c.material.side = THREE.DoubleSide;
            c.material.roughness = 0.9;
            c.material.metalness = 0.0;
            c.material.needsUpdate = true;
        }
    });

    scene.add(model);

    // Fit camera
    const box = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    const distance = size.length();
    camera.position.set(center.x, center.y + distance*0.2, center.z + distance*0.5);
    camera.lookAt(center);

    loaderElement.style.display = 'none';
}, undefined, e => console.error(e));

// Spin animation
let spinAngle = 90;
let isSpinning = true;
function animate(){
    requestAnimationFrame(animate);
    if(model && isSpinning){
        spinAngle += 0.01;
        model.rotation.y = spinAngle;
    }
    controls.update();
    renderer.render(scene, camera);
}
animate();
window.addEventListener('click', ()=> isSpinning=false);

// Responsive resize
window.addEventListener('resize', ()=>{
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
});
</script>
</body>
</html>

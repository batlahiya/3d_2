<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive 3D Model with Skybox</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden;
            height: 100%;
            font-family: 'Arial', sans-serif; /* Futuristic font */
        }
        canvas { 
            display: block; 
        }
        #loader {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            color: #fff;
        }
        #notice {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            font-size: 24px;
            color: #fff;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }
        #notice p {
            text-align: center;
            font-size: 2rem;
            animation: scrollText 5s infinite linear;
        }
        @keyframes scrollText {
            0% { transform: translateY(100%); }
            100% { transform: translateY(-100%); }
        }
        #logo {
            position: fixed;
            top: 20px;
            left: 20px;
            max-width: 200px;
            opacity: 0.8;
            transition: opacity 0.5s ease;
        }
        #logo:hover {
            opacity: 1;
        }
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5); /* Dark overlay on the background */
            z-index: -1; /* Put it behind the model */
        }
    </style>
</head>
<body>
    <div id="loader">Loading...</div>
    <div id="notice"><p>Click and drag to rotate the model!</p></div>
    <div class="overlay"></div> <!-- Dark shade on background -->

    <!-- Logo at the top left corner -->
    <img id="logo" src="logo.png" alt="Logo">

    <script src="https://cdn.jsdelivr.net/npm/three@0.135.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.135.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.135.0/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        // Set up the scene, camera, and renderer
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true; // Enable shadow maps
        document.body.appendChild(renderer.domElement);

        // Set up the loader message
        const loaderElement = document.getElementById('loader');
        const noticeElement = document.getElementById('notice');

        // Hide the notice when clicked
        noticeElement.addEventListener('click', () => {
            noticeElement.style.display = 'none'; // Hide the notice
        });

        // Add OrbitControls for camera movement
        const controls = new THREE.OrbitControls(camera, renderer.domElement);

        // Lighting - extremely bright model
        const ambientLight = new THREE.AmbientLight(0xffffff, 2); // Moderate bright ambient light
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 3); // Strong directional light
        directionalLight.position.set(5, 10, 5);
        directionalLight.castShadow = true; // Enable shadow casting from this light
        scene.add(directionalLight);

        // Add more point lights to increase brightness in various directions
        const pointLight1 = new THREE.PointLight(0xffffff, 2, 100);
        pointLight1.position.set(10, 10, 10);
        pointLight1.castShadow = true; // Enable shadow casting
        scene.add(pointLight1);

        const pointLight2 = new THREE.PointLight(0xffffff, 2, 100);
        pointLight2.position.set(-10, -10, -10);
        pointLight2.castShadow = true; // Enable shadow casting
        scene.add(pointLight2);

        // Additional point light to reduce dark areas in the model
        const pointLight3 = new THREE.PointLight(0xffffff, 3, 100); // Increased intensity
        pointLight3.position.set(0, 10, -10); // Positioned on the opposite side
        pointLight3.castShadow = true;
        scene.add(pointLight3);

        // Add a spotlight for more directed light
        const spotLight = new THREE.SpotLight(0xffffff, 2);
        spotLight.position.set(0, 10, 5);
        spotLight.target.position.set(0, 0, 0);
        spotLight.castShadow = true; // Enable shadow casting
        scene.add(spotLight);
        scene.add(spotLight.target);

        // Load the 6 textures for the skybox using CubeTextureLoader
        const loaderEnvMap = new THREE.CubeTextureLoader();
        const texture = loaderEnvMap.load([
        'textures/skybox/px.jpg', // Positive X (right)
        'textures/skybox/nx.jpg', // Negative X (left)
        'textures/skybox/py.jpg', // Positive Y (up)
        'textures/skybox/ny.jpg', // Negative Y (down)
        'textures/skybox/pz.jpg', // Positive Z (front)
        'textures/skybox/nz.jpg'  // Negative Z (back)
        ]);
        scene.background = texture; // Set the loaded cube textures as the scene's background

        // Load the 3D model (GLTF format)
        const loader = new THREE.GLTFLoader();
        loader.load('5.glb', function(gltf) {
            gltf.scene.position.set(0, 0, 0);
            gltf.scene.rotation.set(0, Math.PI, 0); // Rotate model
            gltf.scene.scale.set(0.01, 0.01, 0.01); // Scale the model
            gltf.scene.castShadow = true;  // Enable the model to cast shadows
            gltf.scene.receiveShadow = true; // Enable the model to receive shadows
            scene.add(gltf.scene); // Add model to the scene

            // Hide loading spinner once the model is loaded
            loaderElement.style.display = 'none';
        }, undefined, function(error) {
            console.error('Error loading model:', error);
        });

        // Create a ground plane to receive the shadow
        const groundGeometry = new THREE.PlaneGeometry(50, 50);
        const groundMaterial = new THREE.ShadowMaterial({ opacity: 0.5 }); // Shadow material for the ground
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = - Math.PI / 2;  // Rotate ground to lie flat
        ground.position.y = -2;  // Position it below the model
        ground.receiveShadow = true;  // Allow the ground to receive shadows
        scene.add(ground);

        // Set camera position
        camera.position.set(0, 2, 5);

        // Add camera axis helper for better visibility of camera orientation
        const cameraHelper = new THREE.AxesHelper(2);
        camera.add(cameraHelper);

        // Flag to control the spinning
        let spinAngle = 0;
        let isSpinning = true;  // Flag to track whether the model should keep spinning

        // Initial rotation of the model (spin 360 degrees)
        function animate() {
            requestAnimationFrame(animate);
            
            // Rotate the model for a 360 spin at the beginning
            if (isSpinning && spinAngle < Math.PI * 2) {
                spinAngle += 0.01; // Adjust speed of rotation
                scene.rotation.y = spinAngle; // Rotate around Y-axis
            }

            controls.update(); // Update camera controls
            renderer.render(scene, camera); // Render the scene from the camera's perspective
        }
        animate();

        // Stop spinning when the model is clicked
        window.addEventListener('click', () => {
            isSpinning = false; // Stop the spin
        });

        // Handle window resizing
        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        });
    </script>
</body>
</html>
